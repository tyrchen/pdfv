[package]
name = "pdfv-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
pdfv-core = { path = "../crates/core" }
serde_json = "1.0.149"

[[bin]]
name = "fuzz_parse_document"
path = "fuzz_targets/fuzz_parse_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_stream_object"
path = "fuzz_targets/fuzz_parse_stream_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_rule_expr"
path = "fuzz_targets/fuzz_rule_expr.rs"
test = false
doc = false
bench = false
