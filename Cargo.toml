[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Tyr Chen <tyr.chen@gmail.com>"]
edition = "2024"
license = "MPL-2.0"
documentation = "https://docs.rs/"
repository = "https://github.com/tyrchen/pdfv"
homepage = "https://github.com/tyrchen/pdfv"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
aes = "0.9.0"
assert_cmd = "2.2.2"
cbc = "0.2.0"
cipher = "0.5.1"
clap = { version = "4.6.1", features = ["derive"] }
config = { version = "0.15.23", default-features = false, features = ["yaml"] }
md-5 = "0.11.0"
predicates = "3.1.4"
quick-xml = "0.40.1"
rayon = "1.12.0"
rc4 = "0.2.0"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
typed-builder = "0.23.2"
proptest = "1.11.0"
rstest = "0.26.1"
flate2 = "1.1.9"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
libfuzzer-sys = "0.4.12"

# workspace crates
pdfv-core = { path = "crates/core" }
