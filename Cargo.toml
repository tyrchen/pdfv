[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Your Name <YourName@yourdomain.com>"]
edition = "2024"
license = "MPL-2.0"
documentation = "https://docs.rs/"
repository = "https://github.com/tchen/pdfv"
homepage = "https://github.com/tchen/pdfv"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
typed-builder = "0.23.2"

# workspace crates
pdfv-core = { path = "crates/core" }
