[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.2"
authors = ["Tyr Chen <tyr.chen@gmail.com>"]
edition = "2024"
license = "MPL-2.0"
documentation = "https://docs.rs/"
repository = "https://github.com/tyrchen/pdfv"
homepage = "https://github.com/tyrchen/pdfv"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.104"
aes = "0.9.4"
assert_cmd = "2.2.2"
cbc = "0.2.1"
cipher = "0.5.2"
clap = { version = "4.6.9", features = ["derive"] }
config = { version = "0.15.27", default-features = false, features = ["yaml"] }
md-5 = "0.11.0"
predicates = "3.1.4"
quick-xml = "0.41.0"
rayon = "1.12.0"
rc4 = "0.2.0"
regex = "1.13.2"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
typed-builder = "0.23.2"
proptest = "1.12.0"
rstest = "0.26.1"
flate2 = "1.1.11"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
libfuzzer-sys = "0.4.13"

# workspace crates
pdfv-core = { version = "0.1.2", path = "crates/core" }
